[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    bblanchon/ArduinoJson@^7.0.0
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.0
    adafruit/Adafruit Unified Sensor@^1.1.0

[env:esp32dev-idf]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
